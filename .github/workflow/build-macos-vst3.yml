## 5. Requisiti della Core156 da confermare

### Routing

Soltanto i bus possono raggiungere le uscite fisiche.

**I bus NON sono obbligati ad avere un'uscita hardware.**

Devono continuare a essere supportati bus interni, Aux, send e routing multilivello.

### Master

Il Master controlla un bus e non un'uscita fisica.

Ordine del processamento:

**Bus → Master Strip → Insert Master → destinazione configurata**

Verificare assenza di elaborazioni duplicate.

### Main

Main è il bus predefinito delle nuove tracce e può essere rinominato.

Preservare il suo ID attraverso le rinomine.

### Preset I/O

Salvataggio, richiamo, import/export e persistenza fra progetti.

Non sovrascrivere il routing dei progetti già salvati quando vengono riaperti.

### Final e Master

Interstage Gain tra Clipper e Limiter, presente anche nei sorgenti originali.

Il comportamento unitario deve preservare l'elaborazione precedente.

Automazione, preset e Save/Reopen devono funzionare.

### Click del Clipper

La PR segnala che i click stazionari non sono ancora confermati.

Non dichiarare risolto il problema senza aver riprodotto e identificato la causa.

Se non riproducibile, mantenere il problema aperto, distinguendolo dalla nuova funzione Gain.

